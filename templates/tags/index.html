{% extends "base.html" %}
{% block title %}Tags · Interview Tracker{% endblock %}

{% block content %}
<h3>Tags</h3>

<form method="post" class="row g-2 mt-2 mb-4">
  <div class="col-md-6"><input type="text" name="name" class="form-control" placeholder="Tag name" required></div>
  <div class="col-md-2"><button class="btn btn-primary w-100">Add</button></div>
</form>

<div class="card">
  <table class="table list-table mb-0">
    <thead><tr><th>Name</th><th>Color</th><th>Used by</th><th></th></tr></thead>
    <tbody>
      {% for t in tags %}
        <tr>
          <td><span class="tag-pill" style="background: {{ t.color }};">{{ t.name }}</span></td>
          <td><code>{{ t.color }}</code></td>
          <td>{{ t.jobs|length }} job(s)</td>
          <td class="text-end">
            <form method="post" action="{{ url_for('tags.delete', tag_id=t.id) }}"
                  onsubmit="return confirm('Delete this tag?');">
              <button class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="4" class="text-center text-muted py-4">No tags yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
